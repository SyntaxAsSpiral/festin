prepare_slip: |
  Prepare a PNG preview of a dinner plan, catalog recipe, praxis card, or note. Does not print. Returns rendered_text for content checks with text-only models. For recipes and praxis, pass recipe_id; kind=recipe is inferred if omitted. Recipe and note band art follows Settings: Babette's pick uses the card category (and note band rules); a named band uses that band for every recipe and note slip. Dinner slips keep their own weekly plates either way. For plans pass kind=plan and week_start; matching draft takes precedence over saved plan. When the week has no plates stored, pass plates {top,bottom,header,pantry} chosen for the season and dinners. Pass quote for a short French closing line on the dinner slip (printed only; default Pour les dames de la maison.). For notes pass kind=note with the title and the text to print; both are required. To print a saved note, read it and write a print-friendly title and text yourself. Saved notes are not written for reading and do not need to be. You may use **bold** sparingly. Pass note_id only to take that note’s band when you omit band. Inspect the supplied preview before printing. {slip_sentence}

print_slip: |
  Print ONE copy of a prepared slip on the kitchen printer. Only call when the user requested physical printing, after checking prepare_slip preview (rendered_text for text-only models). Repeated calls for the same slip will not print again. If status is uncertain, report it and do not create a replacement automatically. {slip_sentence}

prepare_slip.note_id: |
  Saved note id. Supplies only the default band when band is omitted. Read the note and write the title and text yourself.

prepare_slip.band: |
  Note slips only. Omit to use a saved note’s band, or this week’s pantry plate. {band_listing}

prepare_slip.plates: |
  Dinner-slip plates for kind=plan: {top,bottom,header,pantry}. When the week has none stored, choose for the season and dinners from {plate_listing}. Omit when plates are already stored unless asked to change them. A repeat of last week's set is replaced by the weekly rotation.

prepare_slip.quote: |
  Dinner-slip closing line for kind=plan. Short French motto or sign-off, printed only. Omit to keep a stored quote, or the default Pour les dames de la maison.
